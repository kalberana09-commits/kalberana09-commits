<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeyondFrames — Video Editor</title>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:white;
}

nav{
  position:fixed;
  top:0;
  width:100%;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
  background:rgba(8,8,8,.88);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #222;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#b7ff3c;
}

.nav-links{
  display:flex;
  gap:25px;
}

.nav-links a{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.nav-links a:hover{
  color:#b7ff3c;
}

.hero{
  min-height:100vh;
  max-width:1100px;
  margin:auto;
  padding:190px 7% 80px;
  display:flex;
  align-items:center;
}

.hero-content{
  max-width:800px;
}

.tag{
  color:#b7ff3c;
  letter-spacing:5px;
  font-size:15px;
  margin-bottom:45px;
}

h1{
  font-size:clamp(55px,9vw,110px);
  line-height:.9;
  letter-spacing:-5px;
}

h1 span{
  color:#b7ff3c;
}

.hero p{
  color:#999;
  font-size:20px;
  line-height:1.7;
  max-width:650px;
  margin:40px 0;
}

.buttons{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.btn{
  padding:18px 28px;
  border-radius:7px;
  text-decoration:none;
  font-weight:bold;
  display:inline-block;
}

.primary{
  background:#b7ff3c;
  color:#050505;
}

.secondary{
  border:1px solid #333;
  color:white;
}

section{
  max-width:1100px;
  margin:auto;
  padding:100px 7%;
}

.section-title{
  font-size:45px;
  margin-bottom:45px;
}

.section-title span{
  color:#b7ff3c;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  border:1px solid #252525;
  background:#101010;
  padding:30px;
  border-radius:12px;
  min-height:190px;
}

.card h3{
  font-size:22px;
  margin-bottom:15px;
}

.card p{
  color:#888;
  line-height:1.6;
}

.contact{
  text-align:center;
  border-top:1px solid #222;
}

.contact p{
  color:#888;
  margin:20px auto 30px;
  max-width:550px;
}
